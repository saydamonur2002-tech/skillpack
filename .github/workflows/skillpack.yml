name: skillpack

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "cli/[mcp,tuf]"
      - name: Birim testleri
        run: python -m unittest discover -s . -t .
        working-directory: cli
      - name: Örnek paketler
        run: |
          skillpack list
          skillpack route-test
          for pack in examples/*/skillpack.yaml; do
            dir=$(dirname "$pack")
            skillpack validate "$dir"
            skillpack test "$dir"
            skillpack verify "$dir"
          done
