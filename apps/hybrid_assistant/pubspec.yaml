name: hybrid_assistant
description: >
  Tek işlevli hibrit yapay zeka mobil iskeleti.
  Karar lokal JSON kural motorunda; açıklama Firebase AI Logic (Gemini) üzerinden.
  API anahtarı uygulamada yok; App Check zorunlu. Hot-patch yalnız imzalı JSON veri indirir.
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_ai: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_app_check: ^0.5.1
  path_provider: ^2.1.5
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  collection: ^1.19.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/configs/
    - assets/keys/
