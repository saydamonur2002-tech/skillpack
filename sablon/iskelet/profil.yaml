# ============================================================
# YEREL PROFİL — Her işletme kendi değerlerini buraya yazar.
# Sert sınırın dışına çıkamaz.
# Değişiklik: LLM önerir -> şema kontrol eder -> insan onaylar -> testler koşar.
# ============================================================

profil:
  paket: "<paket_adi>"
  isletme: "<yer adi>"
  surum: "<tarih veya numara>"
  degerler:
    "<degisken>": "<deger>"          # ornek: max_agirlik: 25
  degisiklik_kaydi:
    - tarih: "<YYYY-AA-GG>"
      degisen: "<degisken: eski -> yeni>"
      neden: "<ornek: yeni standart>"
      onaylayan: "<ad>"
